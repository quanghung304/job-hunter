spring:
  application:
    name: job-hunter
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobhunter}
    username: ${DB_USER:jobhunter}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

server:
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

# Application settings (docs/architecture/config-spec.md §2).
# Keys are added here, with their documented defaults, by the task that first reads them.
app:
  profile:
    path: ../config/profile.yaml
  http:
    connect-timeout: 5s
    read-timeout: 20s
  pipeline:
    cron: "0 0 7,19 * * *"
    zone: Europe/Rome
    catch-up-after: 6h
    catch-up-enabled: true
    collector-timeout: 2m
  jobs:
    expire-after-days: 14
  llm:
    registry-path: ../config/llm.yaml
    force-model:            # e.g. fake: every purpose uses this registry model
    extract-prompt: extract-v1
    score-prompt: score-v1
    max-calls-per-run: 150
    monthly-budget-usd: 5.00
    allow-paid-calls: ${LLM_ALLOW_PAID_CALLS:false}   # owner consent to PAID models (ADR-0009)
    timeout: 60s
    timeout-local: 180s
  sources:
    arbeitnow:
      enabled: true
      max-items: 200
      min-interval: 1h
      base-url: https://www.arbeitnow.com
      remote-only: true
      page-delay: 2s
      max-pages: 20
    himalayas:
      enabled: true
      max-items: 400
      min-interval: 2h
      base-url: https://himalayas.app
      api-key: ${HIMALAYAS_API_KEY:}
      page-size: 20
      page-delay: 2s
      max-pages: 25
    jobicy:
      enabled: true
      max-items: 200
      min-interval: 6h
      base-url: https://jobicy.com
      count: 100
      call-delay: 2s
      max-pages-per-query: 3
      queries:
        - { geo: europe, industry: engineering }
        - { geo: anywhere, industry: engineering }
        - { tag: java }
    weworkremotely:
      enabled: true
      max-items: 200
      min-interval: 6h
      base-url: https://weworkremotely.com
      feed-delay: 2s
      feeds:
        - /categories/remote-back-end-programming-jobs.rss
        - /categories/remote-full-stack-programming-jobs.rss
        - /categories/remote-devops-sysadmin-jobs.rss
