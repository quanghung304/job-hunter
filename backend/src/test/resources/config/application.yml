# Test-only overrides (classpath:/config/ wins over classpath:/application.yml).
# No scheduled or catch-up pipeline runs in tests: they would call the real job sources.
app:
  pipeline:
    cron: "-"
    catch-up-enabled: false
  # No scheduled digest either; Telegram stays off unless a test turns it on (WireMock).
  notify:
    digest-cron: "-"
    telegram:
      enabled: false
